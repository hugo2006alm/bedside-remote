name: Windows CI
on:
  pull_request:
  workflow_call:
    inputs:
      version:
        type: string
        default: 0.1.0-alpha.1
      sign:
        type: boolean
        default: false
    secrets:
      WINDOWS_SIGNING_PFX_BASE64:
        required: false
      WINDOWS_SIGNING_PASSWORD:
        required: false
      SIGNPATH_API_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.sign && vars.WINDOWS_SIGNING_PROVIDER == 'signpath' && 150 || 25 }}
    env:
      APP_VERSION: ${{ inputs.version || '0.1.0-alpha.1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Provision verified Inno Setup compiler
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno Setup checksum mismatch.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Pyrsys B\.V\.') { throw 'Inno Setup publisher verification failed.' }
          $toolDir = Join-Path $env:RUNNER_TEMP 'innosetup'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOICONS', "/DIR=`"$toolDir`"") -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Inno Setup provisioning failed.' }
          "ISCC_PATH=$(Join-Path $toolDir 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore, format, analyze, build and test
        shell: pwsh
        run: |
          dotnet restore windows/BedsideRemote.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format windows/BedsideRemote.slnx --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build windows/BedsideRemote.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project windows/BedsideRemote.Tests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project windows/BedsideRemote.IntegrationTests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Select signing provider
        id: signing
        shell: pwsh
        env:
          SIGN_RELEASE: ${{ inputs.sign && github.event_name != 'pull_request' }}
          WINDOWS_SIGNING_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER }}
          PFX_BASE64: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_SIGNING_PFX_BASE64 || '' }}
          PFX_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_SIGNING_PASSWORD || '' }}
          SIGNPATH_API_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SIGNPATH_API_TOKEN || '' }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
        run: node scripts/windows-signing.mjs
      - name: Publish Windows x64 and verify native hosts
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'windows-publish'
          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          dotnet publish windows/BedsideRemote.Agent/BedsideRemote.Agent.csproj -c Release -r win-x64 --self-contained true "-p:Version=$env:APP_VERSION" -o $publishDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publishedExe = Join-Path $publishDir 'BedsideRemote.exe'
          $preview = Join-Path $env:RUNNER_TEMP 'windows-preview.png'
          dotnet run --project windows/BedsideRemote.IntegrationTests -c Release --no-build -- "--native-exe=$publishedExe" "--preview=$preview"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign the agent before packaging
        id: agent-signature
        uses: ./.github/actions/sign-windows
        with:
          file: ${{ runner.temp }}/windows-publish/BedsideRemote.exe
          provider: ${{ steps.signing.outputs.provider }}
          artifact-name: unsigned-windows-agent
          artifact-configuration: windows-agent
          api-token: ${{ github.event_name != 'pull_request' && secrets.SIGNPATH_API_TOKEN || '' }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          certificate-thumbprint: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
          pfx-base64: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_SIGNING_PFX_BASE64 || '' }}
          pfx-password: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_SIGNING_PASSWORD || '' }}
      - name: Build installer containing the signed agent
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'windows-publish'
          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $iscc = $env:ISCC_PATH
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'The verified Inno Setup compiler is missing.' }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DPublishDir=$publishDir" "/DOutputDir=$outputDir" windows/installer/bedside-remote.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem -LiteralPath $outputDir -Filter '*setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $installer = $installers[0].FullName
          $expected = Join-Path $outputDir "bedside-remote-windows-x64-v$env:APP_VERSION-setup.exe"
          if ($installer -ne $expected) { Move-Item -LiteralPath $installer -Destination $expected }
      - name: Sign the installer
        id: installer-signature
        uses: ./.github/actions/sign-windows
        with:
          file: ${{ github.workspace }}/artifacts/bedside-remote-windows-x64-v${{ env.APP_VERSION }}-setup.exe
          provider: ${{ steps.signing.outputs.provider }}
          artifact-name: unsigned-windows-installer
          artifact-configuration: windows-installer
          api-token: ${{ github.event_name != 'pull_request' && secrets.SIGNPATH_API_TOKEN || '' }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          certificate-thumbprint: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
          pfx-base64: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_SIGNING_PFX_BASE64 || '' }}
          pfx-password: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_SIGNING_PASSWORD || '' }}
      - name: Verify installation and signing report
        shell: pwsh
        env:
          PROVIDER: ${{ steps.signing.outputs.provider }}
          AGENT_THUMBPRINT: ${{ steps.agent-signature.outputs.thumbprint }}
          INSTALLER_THUMBPRINT: ${{ steps.installer-signature.outputs.thumbprint }}
        run: |
          $expected = Join-Path $env:GITHUB_WORKSPACE "artifacts/bedside-remote-windows-x64-v$env:APP_VERSION-setup.exe"
          $installDir = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'BedsideRemote-install-smoke-João-語'))
          $tempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
          if (-not $installDir.StartsWith($tempRoot, [StringComparison]::OrdinalIgnoreCase)) { throw 'Installer smoke target must stay inside RUNNER_TEMP.' }
          $agentHash = (Get-FileHash (Join-Path $env:RUNNER_TEMP 'windows-publish/BedsideRemote.exe')).Hash
          & ./windows/installer/smoke-test.ps1 -Installer $expected -InstallDirectory $installDir -ExpectedExecutableSha256 $agentHash
          $signed = $env:PROVIDER -ne 'none'
          if ($signed -and (!$env:AGENT_THUMBPRINT -or $env:AGENT_THUMBPRINT -ne $env:INSTALLER_THUMBPRINT)) { throw 'Agent and installer publisher identities differ.' }
          @{ component = 'windows'; signed = $signed; provider = $env:PROVIDER; certificateThumbprint = $env:AGENT_THUMBPRINT; reason = $(if ($signed) { '' } else { 'Trusted Windows signing is not configured.' }) } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-signing.json') -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows visual evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ui
          path: ${{ runner.temp }}/windows-preview.png
          if-no-files-found: error
          retention-days: 7

name: Verify and release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a version even without an eligible Conventional Commit
        type: boolean
        default: false
      release_version:
        description: Optional fresh SemVer for recovery after an AMO version was consumed (for example 0.2.2-alpha.1)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test scripts/*.test.mjs
      - id: version
        env:
          RELEASE_CHANNEL: ${{ vars.RELEASE_CHANNEL || 'alpha' }}
          FORCE_RELEASE: ${{ inputs.publish || 'false' }}
          RELEASE_VERSION: ${{ inputs.release_version || '' }}
        run: node scripts/version.mjs
  android:
    needs: version
    uses: ./.github/workflows/android-ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
  ios:
    needs: version
    uses: ./.github/workflows/ios-ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
      release_artifact: ${{ needs.version.outputs.publish == 'true' && contains(needs.version.outputs.version, '-') }}
  quality:
    uses: ./.github/workflows/quality.yml
  windows:
    needs: version
    uses: ./.github/workflows/windows-ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
      sign: ${{ needs.version.outputs.publish == 'true' }}
    secrets: inherit
  extension:
    # External signing consumes an immutable AMO version. Complete every other check first.
    needs: [version, android, windows, ios, quality]
    uses: ./.github/workflows/extension-ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
      sign: ${{ needs.version.outputs.publish == 'true' }}
    secrets: inherit
  publish:
    needs: [version, android, windows, ios, extension, quality]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Validate artifacts and prepare checksums and release notes
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          PHYSICAL_VALIDATION_APPROVED: ${{ vars.PHYSICAL_VALIDATION_APPROVED || 'false' }}
          INCLUDE_IOS_SIDELOAD: ${{ contains(needs.version.outputs.version, '-') }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous }}
        run: node scripts/prepare-release.mjs
      - name: Create tag and publish in the same workflow
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if git show-ref --verify --quiet "refs/tags/v$APP_VERSION"; then
            test "$(git rev-parse "v$APP_VERSION^{commit}")" = "$GITHUB_SHA"
            gh release view "v$APP_VERSION" >/dev/null
          elif [[ "$APP_VERSION" == *-* ]]; then
            gh release create "v$APP_VERSION" artifacts/* --target "$GITHUB_SHA" --title "Bedside Remote v$APP_VERSION" --notes-file release-notes.md --prerelease
          else
            gh release create "v$APP_VERSION" artifacts/* --target "$GITHUB_SHA" --title "Bedside Remote v$APP_VERSION" --notes-file release-notes.md
          fi

      - name: Update the SideStore source from the published prerelease
        if: contains(needs.version.outputs.version, '-')
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release view "v$APP_VERSION" --json assets,publishedAt | node scripts/sidestore-source.mjs
          branch=sidestore
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --silent; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA" --silent
          fi
          source="repos/$GITHUB_REPOSITORY/contents/sidestore-source.json"
          sha=$(gh api "$source?ref=$branch" --jq .sha 2>/dev/null || true)
          args=()
          if [[ -n "$sha" ]]; then args+=(-f "sha=$sha"); fi
          gh api --method PUT "$source" -f branch="$branch" -f message="Update SideStore source for v$APP_VERSION" \
            -f "content=$(base64 -w0 sidestore-source.json)" "${args[@]}" --silent

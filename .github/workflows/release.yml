name: Verify and release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a version even without an eligible Conventional Commit
        type: boolean
        default: false
      release_version:
        description: Optional fresh SemVer for recovery after an AMO version was consumed (for example 0.2.2-alpha.1)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test scripts/*.test.mjs
      - id: version
        env:
          RELEASE_CHANNEL: ${{ vars.RELEASE_CHANNEL || 'alpha' }}
          FORCE_RELEASE: ${{ inputs.publish || 'false' }}
          RELEASE_VERSION: ${{ inputs.release_version || '' }}
        run: node scripts/version.mjs
  android:
    needs: version
    uses: ./.github/workflows/android-ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
  quality:
    uses: ./.github/workflows/quality.yml
  windows:
    needs: version
    uses: ./.github/workflows/windows-ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
      sign: ${{ needs.version.outputs.publish == 'true' }}
    secrets: inherit
  extension:
    # External signing consumes an immutable AMO version. Complete every other check first.
    needs: [version, android, windows, quality]
    uses: ./.github/workflows/extension-ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
      sign: ${{ needs.version.outputs.publish == 'true' }}
    secrets: inherit
  publish:
    needs: [version, android, windows, extension, quality]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Validate artifacts and prepare checksums and release notes
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          PHYSICAL_VALIDATION_APPROVED: ${{ vars.PHYSICAL_VALIDATION_APPROVED || 'false' }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous }}
        run: node scripts/prepare-release.mjs
      - name: Create tag and publish in the same workflow
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [[ "$APP_VERSION" == *-* ]]; then
            gh release create "v$APP_VERSION" artifacts/* --target "$GITHUB_SHA" --title "Bedside Remote v$APP_VERSION" --notes-file release-notes.md --prerelease
          else
            gh release create "v$APP_VERSION" artifacts/* --target "$GITHUB_SHA" --title "Bedside Remote v$APP_VERSION" --notes-file release-notes.md
          fi

name: BedsideRemote
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    BEDSIDE_VERSION: "0.1.0-alpha.1"
targets:
  BedsideRemote:
    type: application
    platform: iOS
    sources:
      - path: BedsideRemote
        excludes: [Info.plist]
      - path: ../LICENSE
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bedside.remote
        INFOPLIST_FILE: BedsideRemote/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BedsideRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../contracts/youtube-url-cases.json
        buildPhase: resources
    dependencies:
      - target: BedsideRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bedside.remote.tests
  BedsideRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BedsideRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bedside.remote.uitests
        TEST_TARGET_NAME: BedsideRemote
schemes:
  BedsideRemote:
    build:
      targets:
        BedsideRemote: all
    test:
      targets: [BedsideRemoteTests, BedsideRemoteUITests]
